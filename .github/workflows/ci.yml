name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            torch: "torch==2.6.0"
          - python-version: "3.12"
            torch: "torch>=2.6,<3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '${{ matrix.torch }}' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: python -m pytest
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Run installed wheel outside the repository
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.whl
          cd "$(mktemp -d)"
          llm-train --device cpu --steps 2
          llm-generate --checkpoint outputs/tiny/last.pt --max-new-tokens 2 --temperature 0
