[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-from-scratch"
version = "0.1.0"
description = "A readable, reproducible byte-level GPT implemented with PyTorch."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "WeiJie Liu" }]
dependencies = ["torch>=2.6,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
llm-train = "llm_from_scratch.cli:train_main"
llm-generate = "llm_from_scratch.cli:generate_main"

[project.urls]
Repository = "https://github.com/weijieliu-cs/llm-from-scratch"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_from_scratch = ["resources/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
